{{ define "main" }}
<section class="section">
  <div class="container">
    <div class="row">
      <div class="col-lg-8 offset-lg-2">
        <h1 class="mb-4">{{ .Title }}</h1>
        <div class="content">
          {{ .Content }}
        </div>
      </div>
    </div>
  </div>
</section>
<style>
  /* Pagine di testo (privacy, contatti, grazie): titoli piu' contenuti e tabelle leggibili anche su telefono */
  .content h2 { font-size: 1.6rem; margin: 2rem 0 .75rem; }
  .content table { display: block; overflow-x: auto; width: 100%; border-collapse: collapse; font-size: .85rem; line-height: 1.45; margin: 1rem 0 1.5rem; }
  .content th, .content td { padding: .5rem .6rem; border: 1px solid #dfe6da; vertical-align: top; min-width: 120px; }
  .content th { background: #eef3ea; text-align: left; }
  .content code { word-break: break-word; }
</style>
{{ end }}
