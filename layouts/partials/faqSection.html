{{ with .Site.Data.faqSection }}
{{ if .enable }}
<section class="section faq" id="faq">
  <div class="container">
    <div class="row">
      <div class="col-12 text-center mb-5">
        <h2 class="support-section-title">{{ .title }}</h2>
      </div>
    </div>
    <div class="row">
      <div class="col-lg-10 offset-lg-1">
        <div class="accordion" id="faqAccordion">
          {{ range $i, $item := .items }}
          <div class="faq-item">
            <h3 class="faq-question mb-0">
              <button class="btn btn-link faq-toggle" type="button" data-toggle="collapse"
                      data-target="#faq-{{ $i }}" aria-expanded="{{ if eq $i 0 }}true{{ else }}false{{ end }}"
                      aria-controls="faq-{{ $i }}">
                {{ $item.question }}
                <i class="fa fa-chevron-down faq-icon"></i>
              </button>
            </h3>
            <div id="faq-{{ $i }}" class="collapse {{ if eq $i 0 }}show{{ end }}" data-parent="#faqAccordion">
              <div class="faq-answer">{{ $item.answer }}</div>
            </div>
          </div>
          {{ end }}
        </div>
      </div>
    </div>
  </div>
</section>
{{ end }}
{{ end }}
